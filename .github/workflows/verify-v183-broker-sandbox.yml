name: Verify V183 Broker Sandbox Certification
on:
  push:
    branches: [the-father-analytics-deploy, the-father-analytics-staging]
  pull_request:
    branches: [the-father-analytics-deploy, the-father-analytics-staging]
permissions:
  contents: read
jobs:
  v183-broker-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run V183 sandbox regressions
        run: node --test tests/v183-*.test.mjs
