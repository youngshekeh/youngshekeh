name: Verify THE FATHER ANALYTICS

on:
  push:
    branches:
      - the-father-analytics-deploy
      - the-father-analytics-staging
  pull_request:
    branches:
      - the-father-analytics-deploy
      - the-father-analytics-staging

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Verify V140 governance invariants
        run: |
          grep -q 'V140 · PROMOTION REVIEW GATE' gold-live/index.html
          grep -q "renderV140PromotionReviewGate(lab);" src/public-surfaces.ts
          grep -q "set('v140-promotion', 'HUMAN REVIEW ONLY')" src/public-surfaces.ts
          grep -q "set('v140-capital', '0R · LOCKED')" src/public-surfaces.ts
          grep -q "set('v140-live', 'OFF')" src/public-surfaces.ts
          grep -q 'V140 · PROMOTION REVIEW GATE' dist/gold-live/index.html
      - name: Verify V141 runtime sentinel invariants
        run: |
          grep -q 'V141 · RUNTIME RECOVERY SENTINEL' gold-live/index.html
          grep -q "loadV141RuntimeRecoverySentinel()" src/public-surfaces.ts
          grep -q "set('v141-orders', 'OFF')" src/public-surfaces.ts
          grep -q "set('v141-promotion', 'DISABLED')" src/public-surfaces.ts
          grep -q 'V141 · RUNTIME RECOVERY SENTINEL' dist/gold-live/index.html
      - name: Verify V142 recovery engine invariants
        run: |
          test -f api/runtime-recovery.js
          grep -q 'v142-runtime-recovery-engine-v1' api/runtime-recovery.js
          grep -q 'recovery_fresh=' api/runtime-recovery.js
          grep -q "capital_permission: '0R'" api/runtime-recovery.js
          grep -q "live_order_routing: false" api/runtime-recovery.js
          grep -q "automatic_policy_promotion: false" api/runtime-recovery.js
          grep -q 'V142 · RUNTIME RECOVERY ENGINE' gold-live/index.html
          grep -q "loadV142RuntimeRecoveryEngine()" src/public-surfaces.ts
          grep -q "set('v142-orders', 'OFF')" src/public-surfaces.ts
          grep -q "set('v142-promotion', 'DISABLED')" src/public-surfaces.ts
          grep -q 'V142 · RUNTIME RECOVERY ENGINE' dist/gold-live/index.html
      - name: Verify V143 stability confirmation invariants
        run: |
          test -f api/stability-confirmation.js
          test -f supabase/recovery/v143-stability-confirmation.sql
          test -f supabase/functions/runtime-v143-stability-confirmation/index.ts
          grep -q 'v143-stability-confirmation-bridge-v1' api/stability-confirmation.js
          grep -q "capital_permission:'0R'" api/stability-confirmation.js
          grep -q "live_order_routing:false" api/stability-confirmation.js
          grep -q "automatic_policy_promotion:false" api/stability-confirmation.js
          grep -q 'V143 · STABILITY CONFIRMATION ENGINE' gold-live/index.html
          grep -q "loadV143StabilityConfirmation()" src/public-surfaces.ts
          grep -q "set('v143-orders', 'OFF')" src/public-surfaces.ts
          grep -q "set('v143-promotion', 'DISABLED')" src/public-surfaces.ts
          grep -q 'V143 · STABILITY CONFIRMATION ENGINE' dist/gold-live/index.html
