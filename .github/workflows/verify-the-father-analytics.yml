name: Verify THE FATHER ANALYTICS

on:
  push:
    branches:
      - the-father-analytics-deploy
  pull_request:
    branches:
      - the-father-analytics-deploy

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
