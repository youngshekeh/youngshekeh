name: Verify THE FATHER ANALYTICS

on:
  push:
    branches:
      - the-father-analytics-deploy
      - the-father-analytics-staging
  pull_request:
    branches:
      - the-father-analytics-deploy
      - the-father-analytics-staging

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Verify V140 governance invariants
        run: |
          grep -q 'V140 · PROMOTION REVIEW GATE' gold-live/index.html
          grep -q "renderV140PromotionReviewGate(lab);" src/public-surfaces.ts
          grep -q "set('v140-promotion', 'HUMAN REVIEW ONLY')" src/public-surfaces.ts
          grep -q "set('v140-capital', '0R · LOCKED')" src/public-surfaces.ts
          grep -q "set('v140-live', 'OFF')" src/public-surfaces.ts
          grep -q 'V140 · PROMOTION REVIEW GATE' dist/gold-live/index.html
