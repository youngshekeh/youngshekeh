name: V300 Private Gold Engine Semantic HTTP Truth
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'api/gold-liquidity-state-machine.js'
      - 'src/v300-v79-semantic-http.mjs'
      - 'tests/v300-v79-semantic-http.test.mjs'
      - '.github/workflows/v300-v79-semantic-http.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gold-source-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/v300-v79-semantic-http.mjs && node --check api/gold-liquidity-state-machine.js
      - run: node --test tests/v300-v79-semantic-http.test.mjs tests/v297-qa-causality.test.mjs tests/v2991-machine-snapshot-cadence.test.mjs
      - run: |
          grep -Fq 'CHECKOUT_SERVER_GUARD_DEPLOYED=false' src/checkout.ts
          grep -Fq 'V272_CHARGES_ENABLED=false' supabase/functions/create-checkout/index.ts
