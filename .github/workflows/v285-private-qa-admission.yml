name: V285 Incident-Aware Private QA Admission
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'api/autonomous-qa-matrix.js'
      - 'src/v285-qa-upstream-admission.mjs'
      - 'tests/v285-qa-upstream-admission.test.mjs'
      - '.github/workflows/v285-private-qa-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-private-qa-pressure-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify module syntax
        run: |
          node --check api/autonomous-qa-matrix.js
          node --check src/v285-qa-upstream-admission.mjs
      - name: Verify normal, incident, stale, and transport-failure admission
        run: node --test tests/v285-qa-upstream-admission.test.mjs
      - name: Verify real-money gates stay locked
        run: |
          grep -Fq 'V272_CHARGES_ENABLED=false' supabase/functions/create-checkout/index.ts
          grep -Fq 'CHECKOUT_SERVER_GUARD_DEPLOYED=false' src/checkout.ts
