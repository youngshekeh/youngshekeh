name: V222 public Gold launch acceptance
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'src/public-gold-evidence.mjs'
      - 'src/launch-readiness.mjs'
      - 'src/status.ts'
      - 'status/index.html'
      - 'tests/launch-readiness-gate.test.mjs'
      - 'tests/v220-entitlement-launch-proof.test.mjs'
      - 'tests/v222-public-gold-launch.test.mjs'
      - '.github/workflows/v222-public-gold-launch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify-public-gold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/public-gold-evidence.mjs && node --check src/launch-readiness.mjs
      - run: node --test tests/launch-readiness-gate.test.mjs tests/v220-entitlement-launch-proof.test.mjs tests/v222-public-gold-launch.test.mjs
