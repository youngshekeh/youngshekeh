name: Deploy THE FATHER ANALYTICS Gateway

on:
  workflow_dispatch:
  push:
    branches: [thefatheranalytics-production]
    paths:
      - cloudflare-gateway-worker.js
      - wrangler.gateway.toml
      - .github/workflows/deploy-cloudflare-gateway.yml

jobs:
  gateway:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate gateway source
        run: node --check cloudflare-gateway-worker.js
      - name: Detect Cloudflare credentials
        id: gate
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Gateway source validated. Deployment skipped because Cloudflare repository secrets are not configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy workers.dev preview
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy --config wrangler.gateway.toml
