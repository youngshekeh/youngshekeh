name: V212 Independent Commercial Intake
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'research/**'
      - 'src/research*'
      - 'pricing/index.html'
      - 'sitemap.xml'
      - 'public/sitemap.xml'
      - 'public/robots.txt'
      - 'tests/v213-static-seo.test.mjs'
      - 'robots.txt'
      - 'vite.config.ts'
      - 'tests/v212-research-intake.test.mjs'
      - '.github/workflows/v212-commercial-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commercial-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/research-enquiry.mjs
      - run: node --test tests/v212-research-intake.test.mjs tests/v213-static-seo.test.mjs
