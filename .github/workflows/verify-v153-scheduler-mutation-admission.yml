name: Verify V153 Scheduler Mutation Admission
on:
  push:
    branches:
      - tfa-v153-scheduler-mutation-admission
      - the-father-analytics-staging
      - the-father-analytics-deploy
  pull_request:
    branches:
      - the-father-analytics-staging
      - the-father-analytics-deploy
permissions:
  contents: read
jobs:
  v153-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify bridge syntax
        run: node --check api/scheduler-mutation-admission.js
      - name: Verify admission assets
        run: |
          test -f supabase/recovery/v153-scheduler-mutation-admission.sql
          test -f supabase/functions/runtime-v153-scheduler-mutation-admission/index.ts
          grep -q "v153-scheduler-mutation-admission-db-v1" supabase/recovery/v153-scheduler-mutation-admission.sql
          grep -q "LOCKED_PREVIOUS_SHIFT_OBSERVATION" supabase/recovery/v153-scheduler-mutation-admission.sql
          grep -q "READY_FOR_NEXT_HUMAN_REVIEW" supabase/recovery/v153-scheduler-mutation-admission.sql
          grep -q "minimum_minutes_between_mutations',45" supabase/recovery/v153-scheduler-mutation-admission.sql
          grep -q "one_active_scheduler_experiment_max',true" supabase/recovery/v153-scheduler-mutation-admission.sql
      - name: Reject mutation paths
        run: |
          if grep -Eq "cron\.alter_job|cron\.schedule|cron\.unschedule" supabase/recovery/v153-scheduler-mutation-admission.sql; then
            echo "V153 admission governor must remain read-only"
            exit 1
          fi
          grep -q "'automatic_rescheduling',false" supabase/recovery/v153-scheduler-mutation-admission.sql
          grep -q "'automatic_rollback',false" supabase/recovery/v153-scheduler-mutation-admission.sql
          grep -q "'capital_permission','0R'" supabase/recovery/v153-scheduler-mutation-admission.sql
          grep -q "'live_order_routing',false" supabase/recovery/v153-scheduler-mutation-admission.sql
          grep -q "capital_permission:'0R'" api/scheduler-mutation-admission.js
          grep -q "live_order_routing:false" api/scheduler-mutation-admission.js
