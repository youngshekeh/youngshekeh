name: V232 guarded Gold snapshot admission runbook
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'supabase/recovery/v232-gold-snapshot-admission.sql'
      - 'supabase/recovery/v232-gold-snapshot-admission-rollback.sql'
      - 'tests/v232-gold-snapshot-admission.test.mjs'
      - '.github/workflows/v232-gold-snapshot-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-runbook-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/v232-gold-snapshot-admission.test.mjs
      - run: grep -q 'CHECKOUT_SERVER_GUARD_DEPLOYED=false' src/checkout.ts
