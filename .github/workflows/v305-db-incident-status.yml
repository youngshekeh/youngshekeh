name: V305 Incident-Visible Public Status Safety
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'src/v305-db-incident-visibility.mjs'
      - 'src/status.ts'
      - 'status/index.html'
      - 'tests/v305-db-incident-visibility.test.mjs'
      - '.github/workflows/v305-db-incident-status.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transparent-incident-status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/v305-db-incident-visibility.mjs
      - run: node --test tests/v305-db-incident-visibility.test.mjs tests/v250-status-admission.test.mjs tests/v287-qa-observation.test.mjs
      - run: |
          grep -Fq 'CHECKOUT_SERVER_GUARD_DEPLOYED=false' src/checkout.ts
          grep -Fq 'V272_CHARGES_ENABLED=false' supabase/functions/create-checkout/index.ts
