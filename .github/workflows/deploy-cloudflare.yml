name: Deploy THE FATHER ANALYTICS to Cloudflare

on:
  push:
    branches: [thefatheranalytics-production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Detect Cloudflare deployment credentials
        id: gate
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "### Cloudflare deploy gate\nCredentials detected. Deployment will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Cloudflare deploy gate\nDeployment not attempted because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not configured in repository secrets." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate production source
        run: |
          node --check common.js
          node --check access.js
          node --check app.js
          node --check member.js
          node --check owner.js
          node --check status.js
          node --check live-markets.js
          node --check gold-live.js
          node --check _worker.js
          node --check qa.cjs
          node --check worker-smoke.mjs
          node --check postdeploy-smoke.mjs
          python -m json.tool vercel.json >/dev/null
          python -m json.tool health.json >/dev/null
          node qa.cjs
          node worker-smoke.mjs
      - name: Deploy Worker + static assets
        id: publish
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: '1'
        run: |
          set -o pipefail
          npx wrangler@4 deploy 2>&1 | tee /tmp/wrangler-deploy.log
          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -1 || true)"
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::Wrangler completed but a workers.dev preview URL was not detected."
            exit 1
          fi
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare preview\nPublished: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify deployed workers.dev preview
        if: steps.gate.outputs.enabled == 'true' && steps.publish.outputs.url != ''
        env:
          TFA_BASE_URL: ${{ steps.publish.outputs.url }}
        run: node postdeploy-smoke.mjs
      - name: Record non-deployment state
        if: steps.gate.outputs.enabled != 'true'
        run: echo "Cloudflare source is validated, but this run did not publish production."
