name: Launch truth gate
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'src/launch-readiness.mjs'
      - 'src/status.ts'
      - 'status/index.html'
      - 'tests/launch-readiness-gate.test.mjs'
      - '.github/workflows/launch-truth-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check launch evaluator syntax
        run: node --check src/launch-readiness.mjs
      - name: Assert launch truth gates
        run: node --test tests/launch-readiness-gate.test.mjs
