name: V234 public reference and editorial homepage
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'index.html'
      - 'api/public-market-reference.js'
      - 'src/public-market-reference.mjs'
      - 'src/public-market-reference.css'
      - 'src/public-market-reference-data.mjs'
      - 'tests/v234-public-market-reference.test.mjs'
      - '.github/workflows/v234-public-market-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-market-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check api/public-market-reference.js && node --check src/public-market-reference.mjs && node --check src/public-market-reference-data.mjs
      - run: node --test tests/v234-public-market-reference.test.mjs tests/v230-launch-guards.test.mjs
      - run: grep -q 'CHECKOUT_SERVER_GUARD_DEPLOYED=false' src/checkout.ts
