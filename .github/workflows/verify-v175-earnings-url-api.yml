name: Verify V175 Earnings URL API
on:
  push:
    branches: [tfa-v175-earnings-url-api, the-father-analytics-staging, the-father-analytics-deploy]
  pull_request:
    branches: [the-father-analytics-staging, the-father-analytics-deploy]
permissions:
  contents: read
jobs:
  earnings-url-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/v175-earnings-url-api.test.mjs
