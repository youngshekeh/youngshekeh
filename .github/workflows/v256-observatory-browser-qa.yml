name: V256–V258 Chromium Public Research and Recovery Acceptance
on:
  pull_request:
    branches: [the-father-analytics-deploy]
  push:
    branches: [the-father-analytics-deploy]
permissions:
  contents: read
jobs:
  browser-quarterly-observatory:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install app and isolated Chromium test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify available GitHub runner Chrome
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Build actual Vite production pages
        run: npm run build
      - name: Start local Vite production preview
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/v256-preview.log 2>&1 &)
      - name: Verify live page interaction with fake public API responses
        run: node scripts/v256-observatory-browser-qa.mjs
      - name: Verify status-page Gold Oil DXY quarterly isolation in real Chrome
        run: node scripts/v257-status-browser-qa.mjs
      - name: Verify manual-only safe Supabase recovery diagnostics in Chrome
        run: node scripts/v258-recovery-triage-browser-qa.mjs
