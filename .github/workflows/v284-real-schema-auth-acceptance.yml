name: V284 Actual-Schema PostgreSQL 17 and Chromium Auth Acceptance
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'src/member.ts'
      - 'src/member-session-proof.mjs'
      - 'tests/v284-member-session-proof.test.mjs'
      - 'tests/v284-live-schema-parity.test.mjs'
      - 'tests/fixtures/v284-postgres17-prod-schema.sql'
      - 'docs/operations/evidence/v284-live-billing-schema-snapshot.json'
      - 'scripts/v284-test-live-parity-postgres.mjs'
      - 'scripts/v284-member-browser-qa.mjs'
      - '.github/workflows/v284-real-schema-auth-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-schema-shape-on-disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: v284_disposable_pg17_only
          POSTGRES_DB: v284_isolated_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v284_isolated_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: v284_isolated_test
      PGUSER: postgres
      PGPASSWORD: v284_disposable_pg17_only
      PGCONNECT_TIMEOUT: '5'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install PostgreSQL client only if unavailable
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version
      - name: Source syntax and static authorization controls
        run: |
          node --check scripts/v284-test-live-parity-postgres.mjs
          node --test tests/v284-live-schema-parity.test.mjs tests/v284-member-session-proof.test.mjs
      - name: Execute both SQL candidates in real PostgreSQL17 with actual prices and 2 sessions
        run: node scripts/v284-test-live-parity-postgres.mjs
      - name: Keep actual merchant and trading firewall sealed
        run: |
          grep -Fq 'V272_CHARGES_ENABLED=false' supabase/functions/create-checkout/index.ts
          grep -Fq 'CHECKOUT_SERVER_GUARD_DEPLOYED=false' src/checkout.ts
  browser-public-auth-mocked:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: google-chrome --version
      - run: npm run build
      - run: |
          (npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/v284-local-preview.log 2>&1 &)
      - name: Run real Chrome on production-built local pages with fake accounts only
        run: node scripts/v284-member-browser-qa.mjs
