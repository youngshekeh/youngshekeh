name: Verify V177 Transport Retry Discipline
on:
  push:
    branches: [tfa-v177-transport-retry-discipline, the-father-analytics-staging, the-father-analytics-deploy]
  pull_request:
    branches: [the-father-analytics-staging, the-father-analytics-deploy]
permissions:
  contents: read
jobs:
  retry-discipline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/v174-qa-transport.test.mjs tests/v174-qa-handler.test.mjs
