name: V226 checkout Gold launch parity
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'src/checkout.ts'
      - 'tests/v210-commercial-launch-guard.test.mjs'
      - 'tests/v226-checkout-gold-consistency.test.mjs'
      - '.github/workflows/v226-checkout-gold-consistency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkout-launch-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/v210-commercial-launch-guard.test.mjs tests/v220-entitlement-launch-proof.test.mjs tests/v224-deferred-private-qa.test.mjs tests/v226-checkout-gold-consistency.test.mjs
