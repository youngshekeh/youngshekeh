name: Heartbeat continuity guard
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'api/ops-heartbeat.js'
      - 'tests/ops-heartbeat-guard.test.mjs'
      - '.github/workflows/ops-heartbeat-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify heartbeat syntax
        run: node --check api/ops-heartbeat.js
      - name: Verify scheduler continuity, auth and risk locks
        run: node --test tests/ops-heartbeat-guard.test.mjs
