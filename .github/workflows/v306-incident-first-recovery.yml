name: V306 Incident-First Recovery Probe Pressure Control
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'api/public-recovery-triage.js'
      - 'src/read-only-recovery-triage.mjs'
      - 'src/status.ts'
      - 'tests/v258-readonly-recovery-triage.test.mjs'
      - 'tests/v306-incident-first-recovery.test.mjs'
      - '.github/workflows/v306-incident-first-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-readonly-probe-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check api/public-recovery-triage.js && node --check src/read-only-recovery-triage.mjs
      - run: node --test tests/v306-incident-first-recovery.test.mjs tests/v258-readonly-recovery-triage.test.mjs tests/v283-provider-edge-admission.test.mjs
      - run: |
          grep -Fq 'CHECKOUT_SERVER_GUARD_DEPLOYED=false' src/checkout.ts
          grep -Fq 'V272_CHARGES_ENABLED=false' supabase/functions/create-checkout/index.ts
