name: Verify V159 Latest Experiment Admission

on:
  push:
    branches:
      - tfa-v159-latest-experiment-admission
      - tfa-v1591-bounded-admission-hotfix
      - tfa-v162-prospective-collision-revalidation
      - tfa-v165-safe-alternative-admission-handoff
      - the-father-analytics-staging
      - the-father-analytics-deploy
  pull_request:
    branches:
      - the-father-analytics-staging
      - the-father-analytics-deploy

permissions:
  contents: read

jobs:
  v159-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify bridge syntax
        run: node --check api/latest-experiment-admission.js
      - name: Verify admission assets
        run: |
          test -f supabase/recovery/v159-latest-experiment-admission.sql
          test -f supabase/functions/runtime-v159-latest-experiment-admission/index.ts
          test -f supabase/recovery/v158-member-alert-post-shift-observer.sql
          grep -q "v159.3-latest-experiment-admission-db-v4-safe-alternative-handoff" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "LOCKED_LATEST_SHIFT_OBSERVATION" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "READY_FOR_NEXT_HUMAN_REVIEW" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "minimum_minutes_between_mutations',75" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "one_unaccepted_scheduler_experiment_max',true" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "'direct_v147_calls',0" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "'direct_v1461_calls',0" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "'latest_observer_calls',1" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "'v165_calls',1" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "'v162_calls_indirect',v_v165->'runtime_budget'->'v162_calls'" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "'v163_calls_indirect',v_v165->'runtime_budget'->'v163_calls'" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "'direct_v151_calls',0" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "LOCKED_PROSPECTIVE_COLLISION_REVALIDATION" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "'prospective_collision_revalidation',v_candidate_revalidation_pass" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "get_v165_safe_alternative_admission_handoff" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "SAFE_ALTERNATIVE_V163" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "'route',v_v165->>'route'" supabase/recovery/v159-latest-experiment-admission.sql
          if grep -q "get_v151_single_candidate_plan_shadow" supabase/recovery/v159-latest-experiment-admission.sql; then
            echo "V159 must use V165 rather than call V151 directly"
            exit 1
          fi
          if grep -q "get_v162_prospective_collision_revalidation" supabase/recovery/v159-latest-experiment-admission.sql; then
            echo "V159 must use V165 rather than call V162 directly"
            exit 1
          fi
          if grep -q "get_v147_connection_pressure_shadow" supabase/recovery/v159-latest-experiment-admission.sql; then
            echo "V159 must not directly call V147"
            exit 1
          fi
          if grep -q "get_v1461_peak_spreader_status" supabase/recovery/v159-latest-experiment-admission.sql; then
            echo "V159 must not directly call V146.1"
            exit 1
          fi
      - name: Reject mutation paths
        run: |
          if grep -Eq "cron\.alter_job|cron\.schedule|cron\.unschedule" supabase/recovery/v159-latest-experiment-admission.sql; then
            echo "V159 must remain read-only"
            exit 1
          fi
          grep -q "'automatic_rescheduling',false" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "'automatic_rollback',false" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "'capital_permission','0R'" supabase/recovery/v159-latest-experiment-admission.sql
          grep -q "'live_order_routing',false" supabase/recovery/v159-latest-experiment-admission.sql
