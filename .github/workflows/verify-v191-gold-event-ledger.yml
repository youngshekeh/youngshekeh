name: Verify V191 Gold Event Ledger
on:
  push:
    branches: [the-father-analytics-deploy, the-father-analytics-staging]
  pull_request:
    branches: [the-father-analytics-deploy, the-father-analytics-staging]
permissions:
  contents: read
jobs:
  v191-gold-event-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run V191 event-ledger regressions
        run: node --test tests/v191-*.test.mjs
