name: V225 private QA instance pressure guard
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'api/autonomous-qa-matrix.js'
      - 'tests/v225-qa-pressure-guard.test.mjs'
      - '.github/workflows/v225-qa-pressure-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-private-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --check api/autonomous-qa-matrix.js
      - run: node --test tests/v225-qa-pressure-guard.test.mjs tests/v181-shared-qa-pressure-cache.test.mjs tests/v224-deferred-private-qa.test.mjs
