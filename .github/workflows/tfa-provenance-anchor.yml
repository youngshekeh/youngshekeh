name: TFA Provenance External Anchor
# Redundant scheduled heartbeat keeps V112 external provenance liveness fresh.
# Three post-checkpoint runs per hour reduce scheduler-jitter risk while preserving immutable heartbeat artifacts.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tfa-provenance-anchor.yml
  schedule:
    - cron: '15 * * * *'
    - cron: '35 * * * *'
    - cron: '55 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tfa-provenance-external-anchor
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: the-father-analytics-audit
          fetch-depth: 0

      - name: Fetch and validate production checkpoint proof
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp)"
          VERIFIED=0
          for ATTEMPT in 1 2 3 4 5 6; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 \
              'https://thefatheranalytics.com/api/mission-brief?proof=checkpoint' \
              -o "$TMP"

            if PROOF_FILE="$TMP" node <<'PREFLIGHT'
          const fs = require('fs');
          const proof = JSON.parse(fs.readFileSync(process.env.PROOF_FILE, 'utf8'));
          const checkpoint = proof.checkpoint || {};
          const integrity = proof.integrity || {};
          const failures =
            Number(integrity.payload_hash_failures || 0) +
            Number(integrity.hmac_failures || 0) +
            Number(integrity.chain_link_failures || 0) +
            Number(integrity.missing_historical_keys || 0) +
            Number(integrity.uncheckpointed_attestations || 0);

          const valid =
            proof.ok === true &&
            proof.version === 'v111-external-anchor-proof-v1' &&
            proof.state === 'GLOBAL_CHECKPOINT_VERIFIED' &&
            /^[a-f0-9]{64}$/.test(String(checkpoint.checkpoint_sha256 || '')) &&
            failures === 0 &&
            proof.governance?.capital_permission === '0R';

          process.exit(valid ? 0 : 1);
          PREFLIGHT
            then
              VERIFIED=1
              break
            fi

            echo "Checkpoint proof not yet stable on attempt $ATTEMPT/6; retrying in 20s."
            sleep 20
          done

          if [ "$VERIFIED" != "1" ]; then
            echo "Checkpoint proof did not become fully verified within the retry window."
            exit 1
          fi

          PROOF_FILE="$TMP" node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const proof = JSON.parse(fs.readFileSync(process.env.PROOF_FILE, 'utf8'));
          const checkpoint = proof.checkpoint || {};
          const integrity = proof.integrity || {};

          if (proof.ok !== true) throw new Error('Source proof is not OK');
          if (proof.version !== 'v111-external-anchor-proof-v1') throw new Error('Unexpected proof version');
          if (proof.state !== 'GLOBAL_CHECKPOINT_VERIFIED') throw new Error('Checkpoint is not verified');
          if (!/^[a-f0-9]{64}$/.test(String(checkpoint.checkpoint_sha256 || ''))) throw new Error('Invalid checkpoint root');

          const failures =
            Number(integrity.payload_hash_failures || 0) +
            Number(integrity.hmac_failures || 0) +
            Number(integrity.chain_link_failures || 0) +
            Number(integrity.missing_historical_keys || 0) +
            Number(integrity.uncheckpointed_attestations || 0);

          if (failures !== 0) throw new Error('Checkpoint integrity gate failed');
          if (proof.governance?.capital_permission !== '0R') throw new Error('Unexpected capital permission');

          fs.mkdirSync('anchors', { recursive: true });

          const root = checkpoint.checkpoint_sha256;
          let existing = null;
          try {
            existing = JSON.parse(fs.readFileSync('anchors/latest.json', 'utf8'));
          } catch {}
          const existingRoot = existing?.checkpoint?.checkpoint_sha256 || null;
          const verifiedAt = new Date().toISOString();

          const proofSha256 = crypto.createHash('sha256')
            .update(JSON.stringify(proof))
            .digest('hex');

          const anchored = {
            ...proof,
            external_anchor: {
              provider: 'GitHub Actions',
              repository: 'youngshekeh/youngshekeh',
              branch: 'the-father-analytics-audit',
              workflow: 'tfa-provenance-anchor',
              anchored_at:
                existingRoot === root && existing?.external_anchor?.anchored_at
                  ? existing.external_anchor.anchored_at
                  : verifiedAt,
              last_verified_at: verifiedAt,
              verification_count:
                existingRoot === root
                  ? Number(existing?.external_anchor?.verification_count || 1) + 1
                  : 1,
              source_proof_sha256: proofSha256
            }
          };

          // Immutable hourly liveness artifact. Runtime readers can fetch the
          // current or previous UTC hour directly, avoiding mutable CDN cache
          // ambiguity around anchors/latest.json.
          fs.mkdirSync('anchors/heartbeats', { recursive: true });
          const heartbeatHour = verifiedAt.slice(0, 13);
          const heartbeatFile = 'anchors/heartbeats/' + heartbeatHour + '.json';
          if (!fs.existsSync(heartbeatFile)) {
            fs.writeFileSync(heartbeatFile, JSON.stringify({
              ...anchored,
              heartbeat_artifact: {
                version: 'v112-hourly-heartbeat-artifact-v1',
                hour_utc: heartbeatHour,
                immutable: true
              }
            }, null, 2) + '\n');
          }

          if (existingRoot === root) {
            // Keep the immutable checkpoint artifact untouched. Only latest.json
            // receives a liveness heartbeat proving GitHub independently
            // re-fetched and re-validated the same production checkpoint.
            fs.writeFileSync('anchors/latest.json', JSON.stringify(anchored, null, 2) + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'ANCHOR_NEW=0\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'ANCHOR_HEARTBEAT=1\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'ROOT=' + root + '\n');
            process.exit(0);
          }

          const stamp = String(checkpoint.checkpointed_at || new Date().toISOString())
            .replace(/[:.]/g, '-');
          const immutableFile = 'anchors/' + stamp + '-' + root.slice(0, 16) + '.json';

          if (!fs.existsSync(immutableFile)) {
            fs.writeFileSync(immutableFile, JSON.stringify(anchored, null, 2) + '\n');
          }
          fs.writeFileSync('anchors/latest.json', JSON.stringify(anchored, null, 2) + '\n');

          fs.appendFileSync(process.env.GITHUB_ENV, 'ANCHOR_NEW=1\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'ANCHOR_HEARTBEAT=1\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'ANCHOR_FILE=' + immutableFile + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'ROOT=' + root + '\n');
          NODE

      - name: Commit external anchor or heartbeat
        if: env.ANCHOR_NEW == '1' || env.ANCHOR_HEARTBEAT == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "THE FATHER ANALYTICS Anchor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add anchors/
          git diff --cached --quiet && exit 0
          if [ "${ANCHOR_NEW:-0}" = "1" ]; then
            MESSAGE="Anchor checkpoint ${ROOT:0:16}"
          else
            MESSAGE="Verify checkpoint ${ROOT:0:16}"
          fi
          git commit -m "$MESSAGE"
          git push origin HEAD:the-father-analytics-audit
