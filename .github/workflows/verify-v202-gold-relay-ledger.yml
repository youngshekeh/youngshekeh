name: Verify V202 Gold Relay Ledger
on:
  push:
    branches: [the-father-analytics-deploy, the-father-analytics-staging]
  pull_request:
    branches: [the-father-analytics-deploy, the-father-analytics-staging]
permissions:
  contents: read
jobs:
  v202-gold-relay-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run V202 relay-ledger regressions
        run: node --test tests/v202-*.test.mjs
