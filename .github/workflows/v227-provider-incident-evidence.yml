name: V227 Provider incident support evidence
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'src/provider-incident-packet.mjs'
      - 'scripts/v227-provider-support.mjs'
      - 'tests/v227-provider-incident-packet.test.mjs'
      - 'docs/operations/evidence/v227-20261021-provider-aggregates.json'
      - '.github/workflows/v227-provider-incident-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/provider-incident-packet.mjs && node --check scripts/v227-provider-support.mjs
      - run: node --test tests/v227-provider-incident-packet.test.mjs tests/v217-db-incident-acceptance.test.mjs
      - run: |
          node scripts/v227-provider-support.mjs docs/operations/evidence/v227-20261021-provider-aggregates.json support-artifacts
          grep -q 'Commercial' support-artifacts/supabase-support-escalation.md || grep -q 'commercial launch' support-artifacts/supabase-support-escalation.md
          grep -q 'NOT_CERTIFIED' support-artifacts/launch-blocker-verdict.json
