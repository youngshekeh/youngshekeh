name: V304 Source-locked Autonomous Core Repair
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'supabase/recovery/v304_fingerprint_gated_core.sql'
      - 'supabase/recovery/v304_fingerprint_gated_core_rollback.sql'
      - 'tests/v304-core-recovery.test.mjs'
      - '.github/workflows/v304-core-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  autonomous-core-safe-rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/v304-core-recovery.test.mjs tests/v303-bounded-core-generator.test.mjs tests/v301-core-cron-stagger.test.mjs
      - run: |
          grep -Fq 'CHECKOUT_SERVER_GUARD_DEPLOYED=false' src/checkout.ts
          grep -Fq 'V272_CHARGES_ENABLED=false' supabase/functions/create-checkout/index.ts
