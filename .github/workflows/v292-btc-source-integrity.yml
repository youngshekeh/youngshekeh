name: V292 BTC 24/7 Source Integrity
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'src/v292-btc-24h-source.mjs'
      - 'tests/v292-btc-source-integrity.test.mjs'
      - '.github/workflows/v292-btc-source-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  btc-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/v292-btc-24h-source.mjs
      - run: node --test tests/v292-btc-source-integrity.test.mjs tests/v291-smoke-latency.test.mjs
      - run: |
          grep -Fq 'CHECKOUT_SERVER_GUARD_DEPLOYED=false' src/checkout.ts
          grep -Fq 'V272_CHARGES_ENABLED=false' supabase/functions/create-checkout/index.ts
