name: V281 Adaptive Public Feed Incident Containment
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'src/public-feed-pressure.mjs'
      - 'api/market-feed.js'
      - 'api/public-gold-read.js'
      - 'tests/v223-public-feed-pressure.test.mjs'
      - 'tests/v281-adaptive-feed-pressure.test.mjs'
      - '.github/workflows/v281-adaptive-feed-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-adaptive-pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/public-feed-pressure.mjs
      - run: node --check api/market-feed.js
      - run: node --check api/public-gold-read.js
      - run: node --test tests/v223-public-feed-pressure.test.mjs tests/v281-adaptive-feed-pressure.test.mjs
