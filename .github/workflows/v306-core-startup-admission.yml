name: V306 Safe Core Scheduler Recovery Admission
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'src/v306-core-recovery-admission.mjs'
      - 'tests/v306-core-recovery-admission.test.mjs'
      - 'docs/V306_CORE_STARTUP_RECOVERY.md'
      - '.github/workflows/v306-core-startup-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-non-disruptive-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/v306-core-recovery-admission.mjs
      - run: node --test tests/v306-core-recovery-admission.test.mjs tests/v304-core-recovery.test.mjs
      - run: |
          grep -Fq 'CHECKOUT_SERVER_GUARD_DEPLOYED=false' src/checkout.ts
          grep -Fq 'V272_CHARGES_ENABLED=false' supabase/functions/create-checkout/index.ts
