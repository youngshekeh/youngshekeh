name: Verify V174 QA Deadline
on:
  push:
    branches: [tfa-v174-qa-deadline, the-father-analytics-staging, the-father-analytics-deploy]
  pull_request:
    branches: [the-father-analytics-staging, the-father-analytics-deploy]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  qa-deadline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/v174-qa-*.test.mjs
      - run: node scripts/verify-qa-concurrency.mjs
