name: V214 Production Continuity Vault
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'scripts/continuity-vault.mjs'
      - 'tests/v214-continuity-vault.test.mjs'
      - '.github/workflows/v214-continuity-vault.yml'
      - 'docs/continuity/**'
  push:
    branches: [the-father-analytics-deploy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test recovery tools and no-trade policy
        run: |
          node --check scripts/continuity-vault.mjs
          node --test tests/v214-continuity-vault.test.mjs
      - name: Archive exact deployed source on production changes
        if: github.event_name != 'pull_request'
        run: node scripts/continuity-vault.mjs continuity-artifacts
      - name: Preserve source snapshot as GitHub artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfa-production-source
          path: |
            continuity-artifacts/source-manifest.json
            continuity-artifacts/tfa-source.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
