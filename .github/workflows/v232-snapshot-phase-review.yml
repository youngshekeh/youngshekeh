name: V232 safe snapshot cron phasing review
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'src/v232-snapshot-phase.mjs'
      - 'tests/v232-snapshot-phase.test.mjs'
      - 'supabase/recovery/v232-*'
      - '.github/workflows/v232-snapshot-phase-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check src/v232-snapshot-phase.mjs
      - run: node --test tests/v232-snapshot-phase.test.mjs tests/v231-kernel-admission.test.mjs tests/v218-seal-transport-pressure.test.mjs
      - run: grep -q 'CHECKOUT_SERVER_GUARD_DEPLOYED=false' src/checkout.ts
