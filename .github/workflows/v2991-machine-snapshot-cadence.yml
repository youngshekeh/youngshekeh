name: V299.1 Machine Snapshot Cadence Correctness
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'supabase/functions/runtime-v299-mission-evidence/index.ts'
      - 'src/v299-db-evidence-gate.mjs'
      - 'tests/v299-db-mission-evidence.test.mjs'
      - 'tests/v2991-machine-snapshot-cadence.test.mjs'
      - '.github/workflows/v2991-machine-snapshot-cadence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  machine-snapshot-source-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/v299-db-evidence-gate.mjs
      - run: node --test tests/v299-db-mission-evidence.test.mjs tests/v2991-machine-snapshot-cadence.test.mjs
      - run: |
          grep -Fq 'CHECKOUT_SERVER_GUARD_DEPLOYED=false' src/checkout.ts
          grep -Fq 'V272_CHARGES_ENABLED=false' supabase/functions/create-checkout/index.ts
