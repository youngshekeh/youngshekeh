name: Verify V172 Paper Broker Feed
on:
  push:
    branches: [tfa-v172-paper-broker-feed, the-father-analytics-staging, the-father-analytics-deploy]
  pull_request:
    branches: [the-father-analytics-staging, the-father-analytics-deploy]
permissions:
  contents: read
jobs:
  paper-feed-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/v172-paper-quote-*.test.mjs
      - run: node scripts/verify-qa-concurrency.mjs
