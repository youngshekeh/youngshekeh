name: V314 Market Quote-Time Truth

on:
  push:
    branches:
      - fix/v314-market-time-truth-gate
  pull_request:
    branches:
      - security/v313-launch-security-contract
      - the-father-analytics-deploy
    paths:
      - 'api/market-feed.js'
      - 'src/v314-market-time-truth.mjs'
      - 'tests/v314-market-time-truth.test.mjs'
      - '.github/workflows/v314-market-time-truth.yml'

permissions:
  contents: read

jobs:
  fail-closed-quote-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact reviewed source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify market-spine timestamp and WAIT / 0R gates
        run: node --test tests/v314-market-time-truth.test.mjs
