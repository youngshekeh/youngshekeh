name: V268 verified public production smoke
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'src/v268-public-release-smoke.mjs'
      - 'scripts/v268-public-release-smoke.mjs'
      - 'tests/v268-public-release-smoke.test.mjs'
      - '.github/workflows/v268-public-release-smoke.yml'
  push:
    branches: [the-father-analytics-deploy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-smoke-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/v268-public-release-smoke.mjs && node --check scripts/v268-public-release-smoke.mjs
      - run: node --test tests/v268-public-release-smoke.test.mjs
  check-public-production:
    if: github.event_name != 'pull_request'
    needs: verify-public-smoke-contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Match deployed production commit, then check public data and safeguards
        env:
          TFA_EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/v268-public-release-smoke.mjs
