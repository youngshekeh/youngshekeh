name: Verify V161 Scheduler Experiment Registry

on:
  push:
    branches:
      - tfa-v161-scheduler-experiment-registry
      - the-father-analytics-staging
      - the-father-analytics-deploy
  pull_request:
    branches:
      - the-father-analytics-staging
      - the-father-analytics-deploy

permissions:
  contents: read

jobs:
  v161-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify bridge syntax
        run: node --check api/scheduler-experiment-registry.js
      - name: Verify registry assets
        run: |
          test -f supabase/recovery/v161-scheduler-experiment-registry.sql
          test -f supabase/functions/runtime-v161-scheduler-experiment-registry/index.ts
          grep -q "v161-scheduler-experiment-registry-db-v1" supabase/recovery/v161-scheduler-experiment-registry.sql
          grep -q "CHAIN_HEALTHY_LATEST_OBSERVING" supabase/recovery/v161-scheduler-experiment-registry.sql
          grep -q "previous_experiment_must_be_accepted_before_next_apply',true" supabase/recovery/v161-scheduler-experiment-registry.sql
          grep -q "one_unaccepted_experiment_max',true" supabase/recovery/v161-scheduler-experiment-registry.sql
      - name: Reject mutation paths
        run: |
          if grep -Eq "cron\.alter_job|cron\.schedule|cron\.unschedule" supabase/recovery/v161-scheduler-experiment-registry.sql; then
            echo "V161 registry must remain read-only"
            exit 1
          fi
          grep -q "'automatic_rescheduling',false" supabase/recovery/v161-scheduler-experiment-registry.sql
          grep -q "'automatic_rollback',false" supabase/recovery/v161-scheduler-experiment-registry.sql
          grep -q "'capital_permission','0R'" supabase/recovery/v161-scheduler-experiment-registry.sql
          grep -q "'live_order_routing',false" supabase/recovery/v161-scheduler-experiment-registry.sql
