name: V219 Offline Research Scope Studio
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'research/index.html'
      - 'src/research.ts'
      - 'src/research-scope.mjs'
      - 'src/research-enquiry.mjs'
      - 'src/research.css'
      - 'tests/v219-research-scope-studio.test.mjs'
      - '.github/workflows/v219-research-scope-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-commercial-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/research-scope.mjs
      - run: node --check src/research-enquiry.mjs
      - run: node --test tests/v212-research-intake.test.mjs tests/v219-research-scope-studio.test.mjs
