name: V224 deferred private QA admission
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'src/qa-admission.mjs'
      - 'src/status.ts'
      - 'tests/v224-deferred-private-qa.test.mjs'
      - '.github/workflows/v224-deferred-private-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deferred-private-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/qa-admission.mjs && node --check src/launch-readiness.mjs
      - run: node --test tests/v224-deferred-private-qa.test.mjs tests/launch-readiness-gate.test.mjs tests/v220-entitlement-launch-proof.test.mjs tests/v222-public-gold-launch.test.mjs
