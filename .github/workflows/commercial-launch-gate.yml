name: Commercial launch safety gate
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'pricing/**'
      - 'checkout/**'
      - 'src/commercial-*'
      - 'src/pricing.ts'
      - 'src/checkout.ts'
      - 'src/access.ts'
      - 'access/index.html'
      - 'supabase/functions/create-checkout/**'
      - 'tests/v210-commercial-launch-guard.test.mjs'
      - 'vite.config.ts'
      - '.github/workflows/commercial-launch-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commercial-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/commercial-gates.mjs
      - run: node --test tests/v210-commercial-launch-guard.test.mjs
