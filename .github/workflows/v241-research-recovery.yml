name: V241–V252 Gold Oil DXY research integrity preflight
on:
  pull_request:
    branches: [the-father-analytics-deploy]
  push:
    branches: [the-father-analytics-deploy]
permissions:
  contents: read
jobs:
  research-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/v241-*.test.mjs tests/v242-*.test.mjs tests/v243-*.test.mjs tests/v244-*.test.mjs tests/v245-*.test.mjs tests/v246-*.test.mjs tests/v247-*.test.mjs tests/v248-*.test.mjs tests/v249-*.test.mjs tests/v250-*.test.mjs tests/v251-*.test.mjs tests/v252-*.test.mjs
      - run: node scripts/v247-cron-collision-audit.mjs > /dev/null
