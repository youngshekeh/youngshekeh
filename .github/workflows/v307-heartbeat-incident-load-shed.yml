name: V307 Incident-Aware Heartbeat Load Shed
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'src/v307-heartbeat-incident-admission.mjs'
      - 'api/ops-heartbeat.js'
      - 'tests/v307-heartbeat-incident-admission.test.mjs'
      - 'docs/V307_HEARTBEAT_INCIDENT_LOAD_SHED.md'
      - '.github/workflows/v307-heartbeat-incident-load-shed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-heartbeat-circuit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check src/v307-heartbeat-incident-admission.mjs
      - run: node --check api/ops-heartbeat.js
      - run: node --test tests/v307-heartbeat-incident-admission.test.mjs tests/v231-kernel-admission.test.mjs tests/v306-core-recovery-admission.test.mjs
      - run: |
          grep -Fq 'CHECKOUT_SERVER_GUARD_DEPLOYED=false' src/checkout.ts
          grep -Fq 'V272_CHARGES_ENABLED=false' supabase/functions/create-checkout/index.ts
