name: Directional Eye research checks
on:
  pull_request:
    branches: [the-father-analytics-deploy]
  push:
    branches: [the-father-analytics-deploy]
permissions:
  contents: read
jobs:
  research-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/directional-eye*.test.mjs
