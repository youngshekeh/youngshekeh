name: V301 Autonomous Core Cron Pressure Mitigation
on:
  pull_request:
    branches: [the-father-analytics-deploy]
    paths:
      - 'supabase/recovery/v301_autonomous_core_cron_stagger.sql'
      - 'supabase/recovery/v301_autonomous_core_cron_rollback.sql'
      - 'tests/v301-core-cron-stagger.test.mjs'
      - '.github/workflows/v301-core-cron-pressure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-cron-collision:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test tests/v301-core-cron-stagger.test.mjs tests/v2991-machine-snapshot-cadence.test.mjs tests/v300-v79-semantic-http.test.mjs
      - run: |
          grep -Fq 'CHECKOUT_SERVER_GUARD_DEPLOYED=false' src/checkout.ts
          grep -Fq 'V272_CHARGES_ENABLED=false' supabase/functions/create-checkout/index.ts
