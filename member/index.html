<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Member Portal | THE FATHER ANALYTICS</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <div class="label">THE FATHER ANALYTICS · MEMBER</div>
      <h1>Member access.</h1>
      <p class="muted">
        Your password is sent directly from this browser to the existing
        Supabase Auth project.
      </p>
      <section class="card" style="max-width: 560px">
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="Email"
        />
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
        />
        <div class="row" style="margin-top: 12px">
          <button id="signin">Sign in</button>
          <button id="signout" class="secondary" type="button">
            Clear session
          </button>
        </div>
        <div id="result" class="muted" style="margin-top: 12px">
          Waiting for sign-in.
        </div>
      </section>
      <section id="session" class="card status-box hidden">
        <div class="label">Member session</div>
        <div id="access" class="value good">AUTHENTICATED</div>
        <div id="sessionDetail" class="muted"></div>
      </section>
      <div class="row" style="margin-top: 14px">
        <a class="secondary" href="../access/">Access Gateway</a>
        <a class="secondary" href="../owner/">Owner</a>
      </div>
    </main>
    <script type="module" src="/src/member.ts"></script>
  </body>
</html>
