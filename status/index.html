<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Status | THE FATHER ANALYTICS</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <div class="label">THE FATHER ANALYTICS · STATUS</div>
      <h1>Production status.</h1>
      <section class="grid">
        <article class="card">
          <div class="label">Auth runtime</div>
          <div id="auth" class="value wait">CHECKING</div>
        </article>
        <article class="card">
          <div class="label">Final readiness</div>
          <div id="ready" class="value wait">CHECKING</div>
        </article>
        <article class="card">
          <div class="label">Commercial acceptance</div>
          <div id="billing" class="value wait">CHECKING</div>
        </article>
      </section>
      <section class="card status-box">
        <div id="detail" class="muted">Loading runtime observations...</div>
      </section>
      <div class="row" style="margin-top: 14px">
        <a class="secondary" href="../access/">Access Gateway</a>
      </div>
    </main>
    <script type="module" src="/src/status.ts"></script>
  </body>
</html>
